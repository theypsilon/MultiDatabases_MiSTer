name: Build custom databases

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: multi-databases-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test database tooling
        run: python3 -m unittest discover -s .github -p "test_*.py"

      - name: Restore previously published databases
        shell: bash
        run: |
          set -euo pipefail

          entries=(*/)
          mkdir -p dist

          if ! git ls-remote --exit-code --heads origin refs/heads/db > /dev/null; then
            exit 0
          fi

          db_ref="refs/remotes/origin/db"
          git fetch --depth=1 origin "+refs/heads/db:$db_ref"
          for entry_path in "${entries[@]}"; do
            entry="${entry_path%/}"
            if git cat-file -e "$db_ref:$entry/db.json"; then
              git archive "$db_ref" -- "$entry" | tar -x -C dist
            fi
          done

      - name: Prepare MiSTer DVD derived payload
        id: prepare_dvd_payload
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          payload_dir="$RUNNER_TEMP/mister-dvd-payload"
          python3 mister-dvd/generate_db.py --prepare-payload "$payload_dir"
          echo "MISTER_DVD_PREPARED_DIR=$payload_dir" >> "$GITHUB_ENV"

      - name: Publish immutable derived payload
        if: steps.prepare_dvd_payload.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          payload_dir="$MISTER_DVD_PREPARED_DIR"
          asset_root=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["asset_root"])' \
            "$payload_dir/manifest.json")
          marker_path=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["marker_path"])' \
            "$payload_dir/manifest.json")
          source_directory="$payload_dir/files/$asset_root"
          assets_worktree="$RUNNER_TEMP/MultiDatabases_MiSTer-db-assets"
          assets_ref="refs/remotes/origin/db-assets"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git ls-remote --exit-code --heads origin refs/heads/db-assets > /dev/null; then
            git fetch origin "+refs/heads/db-assets:$assets_ref"
            git worktree add --detach "$assets_worktree" "$assets_ref"
          else
            git worktree add --detach "$assets_worktree"
            git -C "$assets_worktree" checkout --orphan db-assets
            git -C "$assets_worktree" rm -rf .
          fi
          trap 'git worktree remove --force "$assets_worktree" > /dev/null 2>&1 || true' EXIT

          target_directory="$assets_worktree/$asset_root"
          if [ -e "$target_directory" ]; then
            if ! diff --brief --recursive "$source_directory" "$target_directory"; then
              echo "Refusing to replace immutable payload: $asset_root" >&2
              exit 1
            fi
          else
            mkdir -p "$(dirname "$target_directory")"
            cp -a "$source_directory" "$target_directory"
            git -C "$assets_worktree" add "$asset_root"
            git -C "$assets_worktree" commit -m "Publish $asset_root"
            git -C "$assets_worktree" push origin HEAD:refs/heads/db-assets
          fi

          asset_commit=$(git -C "$assets_worktree" log \
            --diff-filter=A --reverse --format=%H -- "$marker_path" | head -n 1)
          if [ -z "$asset_commit" ]; then
            echo "Unable to find the commit introducing $asset_root" >&2
            exit 1
          fi
          git -C "$assets_worktree" cat-file -e "$asset_commit:$marker_path"
          echo "MISTER_DVD_PAYLOAD_REVISION=$asset_commit" >> "$GITHUB_ENV"
          echo "Published $asset_root at $asset_commit"

      - name: Generate every database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/generate_all.py --output dist --repository "$GITHUB_REPOSITORY"

      - name: Validate generated bundles
        run: python3 .github/validate_bundles.py dist

      - name: Download MiSTer Downloader integration tester
        run: >
          curl --fail --location
          --output "$RUNNER_TEMP/downloader_test.py"
          https://github.com/MiSTer-devel/Downloader_MiSTer/releases/download/latest/downloader_test.py

      - name: Test generated databases with MiSTer Downloader
        run: >
          python3 .github/run_downloader_tests.py
          "$RUNNER_TEMP/downloader_test.py"
          dist

      - name: Publish orphan db branch
        id: publish
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          if ! compgen -G "dist/*/db.json" > /dev/null; then
            echo "No database survived this build; leaving the db branch alone"
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          publish_worktree="$RUNNER_TEMP/MultiDatabases_MiSTer-db"
          git worktree add --detach "$publish_worktree"
          trap 'git worktree remove --force "$publish_worktree" > /dev/null 2>&1 || true' EXIT

          git -C "$publish_worktree" checkout --orphan db
          git -C "$publish_worktree" rm -rf .
          cp -a dist/. "$publish_worktree"/
          git -C "$publish_worktree" add .

          # Unchanged bundles are preserved byte-for-byte, so an identical tree
          # means no database moved and the published commit still stands.
          published=$(git rev-parse --verify --quiet refs/remotes/origin/db \
            || git hash-object -t tree /dev/null)
          if git -C "$publish_worktree" diff --quiet --cached "$published"; then
            echo "No database changed; leaving the db branch alone"
            exit 0
          fi
          entries=$(git -C "$publish_worktree" diff --name-only --cached "$published" \
            | cut -d/ -f1 | sort -u | tr '\n' ' ')

          git -C "$publish_worktree" commit -m "Generate databases"
          git -C "$publish_worktree" push --force origin db

          db_commit=$(git -C "$publish_worktree" rev-parse --verify HEAD)
          echo "db_commit=$db_commit" >> "$GITHUB_OUTPUT"
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "Published $db_commit with changes in: $entries"

      - name: Track the published database on the db-releases branch
        if: steps.publish.outputs.db_commit != ''
        env:
          DB_COMMIT: ${{ steps.publish.outputs.db_commit }}
          DB_ENTRIES: ${{ steps.publish.outputs.entries }}
        run: python3 .github/track_release.py "$DB_COMMIT" --entries $DB_ENTRIES

      - name: Report databases that could not be updated
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -s .build/failures.txt ]; then
            echo "These databases could not be updated:"
            cat .build/failures.txt
            exit 1
          fi
