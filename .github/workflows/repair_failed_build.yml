name: Repair failed database build

on:
  workflow_run:
    workflows: ["Build custom databases"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

env:
  REPAIR_LABEL: auto-repair
  REPAIR_BRANCH_PREFIX: repair/

jobs:
  repair:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    concurrency:
      group: multi-databases-repair
      cancel-in-progress: false

    steps:
      - name: Skip while a repair pull request is open
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # The build runs every 20 minutes, so a red build fires this workflow
          # again and again. One open repair pull request is enough: stop here
          # until it is merged or closed.
          open=$(gh pr list --state open --limit 100 \
            --json number,headRefName,labels \
            | jq -r --arg label "$REPAIR_LABEL" \
              --arg prefix "$REPAIR_BRANCH_PREFIX" \
              '[.[] | select(
                (.headRefName | startswith($prefix)) or
                any(.labels[]; .name == $label)
              ) | .number] | join(", ")')
          if [ -n "$open" ]; then
            echo "Repair pull request already open (#$open); nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Check out source branch
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ask Claude for a fix
        id: claude
        if: steps.guard.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          branch_prefix: repair/
          bot_id: "41898282"
          bot_name: github-actions[bot]
          settings: |
            {
              "attribution": {
                "commit": "",
                "pr": ""
              }
            }
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --allowedTools Read,Edit,Write,Bash,Grep,Glob,WebFetch,WebSearch
          prompt: |
            The scheduled "Build custom databases" workflow failed:
            ${{ github.event.workflow_run.html_url }}

            Pull the logs yourself, run id ${{ github.event.workflow_run.id }}:

                gh run view ${{ github.event.workflow_run.id }} --log-failed

            Its `.build/failures.txt` names the entries that could not be
            updated. `gh run view --log` gives the whole run if you need more
            than the failing step.

            Use the preconfigured github-actions[bot] identity for every git
            commit. Never add a Co-Authored-By trailer or any Claude/Anthropic
            authorship or attribution to commits or pull requests.

            Read GUIDELINES.md before anything else. It is the authoritative
            source of truth for how this repository generates and publishes
            databases, and it governs every change you make here. Where this
            prompt and GUIDELINES.md disagree, GUIDELINES.md wins: what follows
            is a reminder of the two rules that decide most of this work, not a
            substitute for reading the file.

            - A generator is meant to fail loudly rather than silently freeze
              on a stale version. A red build is often that gate working as
              designed, asking a human to review what upstream did.
            - Release notes and descriptions are human-facing prose, never a
              machine-readable interface.

            Its other rules bind you just as much - immutable payload URLs, a
            published db_url that never changes, the README requirements, the
            publication invariants - so check the file against the case in
            front of you instead of working from this summary. If it genuinely
            does not cover the situation, say so in the pull request and
            propose the rule it is missing; do not invent a local convention.

            So do not relax a selection rule or widen a regex to make the
            build green. Recording a deliberate exception as a reviewed
            constant is the mechanism GUIDELINES.md prescribes, but "reviewed"
            means reviewed by a human: propose the value in the pull request,
            never record one yourself to turn the build green. If the failure
            is a deliberate gate, that pull request - explaining what upstream
            changed and proposing the value for a human to accept or reject -
            is the whole deliverable.

            For evidence you have the full history of main. The published
            branches are not checked out, but the checkout kept its
            credentials, so fetch them yourself, read-only:

                git fetch --depth=1 origin +refs/heads/db:refs/remotes/origin/db
                git fetch --depth=1 origin \
                  +refs/heads/db-releases:refs/remotes/origin/db-releases

            - `origin/db` is what users are served right now. Regenerate the
              failing entry and diff it against
              `git show origin/db:<entry>/db.json`, ignoring the `timestamp`
              field, to prove whether your change is a real change or a no-op.
              A fix that leaves the bundle byte-identical is strong evidence it
              restored the previous behaviour rather than moving users.
            - `origin/db-releases` logs every publication in `commits.txt`,
              and in `<entry>/commits.txt` for each entry whose bundle has
              changed since tracking started, so you can see when that database
              last moved. A missing per-entry file means it has not moved,
              which is itself useful evidence.

            Use `gh api` for upstream release metadata - tags, assets, dates,
            draft and prerelease flags. WebFetch and WebSearch are there to
            help you understand what upstream did and explain it in the pull
            request, never to source a value: decide from structured metadata
            and validated artifacts, never from release notes, announcements or
            forum prose. Do not push either orphan branch; they are here to
            read.

            Work out what actually broke, then:

            1. Fix it if it is a genuine defect, following the guidelines,
               including the entry README and focused tests under
               .github/test_entry_generators.py.
            2. Verify with `python3 -m unittest discover -s .github -p "test_*.py"`
               and by running the affected entry's generator.
            3. Open a pull request. In the body, state what upstream changed,
               which guideline governs the decision, why the change respects
               it, and what you verified. If the correct answer is that a human
               must review an upstream change, say so plainly and propose the
               specific value to review rather than a workaround.

            Keep the scope on the failure: fix what broke, not other things
            you notice on the way. Within that scope the shared
            `.github/db_helpers.py` is fair game - fix the defect where it
            really is rather than duplicating shared logic into an entry to
            keep the diff small.

            If you do change shared code, prove it did not disturb the other
            databases before you open the pull request. Generate every entry
            twice, once from main and once with your change, both seeded from
            the published bundles and pinned to the same timestamp:

                git worktree add /tmp/base origin/main
                for out in /tmp/base-out /tmp/fixed-out; do
                  mkdir -p "$out" && git archive origin/db | tar -x -C "$out"
                done
                python3 /tmp/base/.github/generate_all.py \
                  --output /tmp/base-out --timestamp 1700000000
                python3 .github/generate_all.py \
                  --output /tmp/fixed-out --timestamp 1700000000
                for e in /tmp/base-out/*/; do
                  n=$(basename "$e")
                  cmp -s "$e/db.json" "/tmp/fixed-out/$n/db.json" \
                    || echo "MOVED: $n"
                done

            Only the entry you fixed may be listed. Compare `db.json` and not
            the whole bundle: a pinned timestamp makes `db.json` reproducible,
            but the ZIPs embed a wall-clock time and differ between runs even
            with identical input. Generate the baseline the same way rather
            than comparing against `origin/db` directly, or an entry that
            merely had an upstream release since the last publish will look
            like your regression. Report in the pull request that you ran this
            and what moved. Never touch the db or db-releases branches.

      - name: Label and verify the repair pull request
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          pr=""
          if [ -n "$BRANCH" ]; then
            pr=$(gh pr list --head "$BRANCH" --state open \
              --json number --jq '.[0].number // ""')
          fi

          if [ -z "$pr" ]; then
            # Agent mode does not update the action's branch_name output when
            # Claude creates a branch itself with git. The guard established
            # that no repair PR existed before Claude ran, and concurrency
            # prevents another repair job from racing this lookup.
            mapfile -t candidates < <(
              gh pr list --base "$BASE_BRANCH" --state open --limit 100 \
                --json number,headRefName \
                | jq -r --arg prefix "$REPAIR_BRANCH_PREFIX" \
                  '.[] | select(.headRefName | startswith($prefix))
                    | [.number, .headRefName] | @tsv'
            )

            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "::error::Expected one new repair pull request, found ${#candidates[@]}"
              exit 1
            fi
            IFS=$'\t' read -r pr BRANCH <<< "${candidates[0]}"
          fi

          gh label create "$REPAIR_LABEL" --color B60205 \
            --description "Automated repair of a failed database build" \
            > /dev/null 2>&1 || true
          gh pr edit "$pr" --add-label "$REPAIR_LABEL"

          # A pull request opened with GITHUB_TOKEN does not start a push
          # build, but workflow_dispatch is the documented exception, so the
          # branch gets a real run of the pipeline. The publish step is
          # restricted to main, so this verifies without touching db.
          previous_run=$(gh run list --workflow build_databases.yml --branch "$BRANCH" \
            --limit 1 --json databaseId --jq '.[0].databaseId // ""')
          gh workflow run build_databases.yml --ref "$BRANCH"

          run_id=""
          for _ in $(seq 1 12); do
            sleep 10
            run_id=$(gh run list --workflow build_databases.yml --branch "$BRANCH" \
              --limit 1 --json databaseId --jq '.[0].databaseId // ""')
            [ -n "$run_id" ] && [ "$run_id" != "$previous_run" ] && break
            run_id=""
          done
          if [ -z "$run_id" ]; then
            gh pr comment "$pr" --body "Could not start a verification build for \`$BRANCH\`."
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/$run_id"
          gh run watch "$run_id" --exit-status > /dev/null 2>&1 && result=passed || result=failed
          printf '%s\n\n%s\n' \
            "Verification build **$result**: $run_url" \
            "Triggered from the repair of ${{ github.event.workflow_run.html_url }}." \
            | gh pr comment "$pr" --body-file -

  continue-repair:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type == 'User' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    concurrency:
      group: multi-databases-repair
      cancel-in-progress: false

    steps:
      - name: Validate the repair continuation
        id: continuation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          permission=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" \
            --jq '.permission')
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "::error::$ACTOR does not have write access to continue a repair"
              exit 1
              ;;
          esac

          details=$(gh pr view "$PR_NUMBER" \
            --json state,baseRefName,headRefName,headRefOid,isCrossRepository,labels)
          state=$(jq -r '.state' <<< "$details")
          base=$(jq -r '.baseRefName' <<< "$details")
          branch=$(jq -r '.headRefName' <<< "$details")
          head_sha=$(jq -r '.headRefOid' <<< "$details")
          cross_repository=$(jq -r '.isCrossRepository' <<< "$details")
          is_repair=$(jq -r --arg label "$REPAIR_LABEL" \
            --arg prefix "$REPAIR_BRANCH_PREFIX" \
            '(.headRefName | startswith($prefix)) or
             any(.labels[]; .name == $label)' <<< "$details")

          if [ "$state" != OPEN ] || [ "$base" != "$BASE_BRANCH" ] \
            || [ "$cross_repository" != false ] || [ "$is_repair" != true ]; then
            echo "::error::PR #$PR_NUMBER is not an open same-repository repair of $BASE_BRANCH"
            exit 1
          fi

          gh label create "$REPAIR_LABEL" --color B60205 \
            --description "Automated repair of a failed database build" \
            > /dev/null 2>&1 || true
          gh pr edit "$PR_NUMBER" --add-label "$REPAIR_LABEL" > /dev/null

          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.continuation.outputs.branch }}
          fetch-depth: 0

      - name: Apply the reviewed decision
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          bot_id: "41898282"
          bot_name: github-actions[bot]
          settings: |
            {
              "attribution": {
                "commit": "",
                "pr": ""
              }
            }
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --allowedTools Read,Edit,Write,Bash,Grep,Glob,WebFetch,WebSearch
          prompt: |
            Continue the automated database repair in pull request
            #${{ github.event.issue.number }}. An authorized human replied:

            ---
            ${{ github.event.comment.body }}
            ---

            Use the preconfigured github-actions[bot] identity for every git
            commit. Never add a Co-Authored-By trailer or any Claude/Anthropic
            authorship or attribution to commits or pull requests.

            Read GUIDELINES.md before doing anything else. Then use `gh` to
            read the pull request body, its current diff, and its discussion;
            interpret the reply in that context. Treat an explicit,
            unambiguous choice in the reply as the human review required for a
            deliberate constant. If the reply is ambiguous, make no code
            change and comment on the pull request with the exact decision you
            still need.

            Work only on the existing checked-out repair branch. Do not open
            another pull request. Implement the reviewed choice completely,
            including focused tests and README changes when GUIDELINES.md
            requires them. Run the affected generator and
            `python3 -m unittest discover -s .github -p "test_*.py"`, then
            commit and push the result to the existing branch. Comment on the
            pull request with what you changed and verified.

      - name: Verify the continued repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.continuation.outputs.branch }}
          PREVIOUS_HEAD: ${{ steps.continuation.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          current_head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$current_head" = "$PREVIOUS_HEAD" ]; then
            gh pr comment "$PR_NUMBER" --body \
              "Claude made no commit. Reply again with an explicit choice if the decision was ambiguous."
            echo "::error::Claude made no commit on $BRANCH"
            exit 1
          fi

          previous_run=$(gh run list --workflow build_databases.yml --branch "$BRANCH" \
            --limit 1 --json databaseId --jq '.[0].databaseId // ""')
          gh workflow run build_databases.yml --ref "$BRANCH"

          run_id=""
          for _ in $(seq 1 12); do
            sleep 10
            run_id=$(gh run list --workflow build_databases.yml --branch "$BRANCH" \
              --limit 1 --json databaseId --jq '.[0].databaseId // ""')
            [ -n "$run_id" ] && [ "$run_id" != "$previous_run" ] && break
            run_id=""
          done
          if [ -z "$run_id" ]; then
            gh pr comment "$PR_NUMBER" --body \
              "Could not start a verification build for \`$BRANCH\`."
            exit 1
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/$run_id"
          status=0
          gh run watch "$run_id" --exit-status > /dev/null 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            result=passed
          else
            result=failed
          fi
          printf '%s\n\n%s\n' \
            "Verification build **$result**: $run_url" \
            "Triggered after the reviewed decision in ${{ github.event.comment.html_url }}." \
            | gh pr comment "$PR_NUMBER" --body-file -
          exit "$status"
